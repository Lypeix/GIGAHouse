services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      GIGAHOUSE_APP_NAME: ${GIGAHOUSE_APP_NAME}
      GIGAHOUSE_ENVIRONMENT: ${GIGAHOUSE_ENVIRONMENT}
      GIGAHOUSE_DEBUG: ${GIGAHOUSE_DEBUG}
      GIGAHOUSE_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
        ]

      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
  
  db:
    image: postgres:18-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s



    volumes:
      - "postgres_data:/var/lib/postgresql"


  test-db:
    image: postgres:18-alpine
    profiles: ["test"]

    environment:

      POSTGRES_DB: gigahouse_test
      POSTGRES_USER: gigahouse_user
      POSTGRES_PASSWORD: test-password

    ports:
      - "127.0.0.1:5433:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
        
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  postgres_data:
